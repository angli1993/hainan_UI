<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>量知 · 临床数据工作台</title>
  <style>html,body{margin:0;min-width:320px;background:#f7f9f8}button,input,select,textarea{font:inherit}</style>
  <script>
    (() => {
      const key = 'hainan-ui-prototype-state';
      let privateContent = null;
      try { privateContent = JSON.parse(localStorage.getItem(key) || 'null'); } catch (_) {}
      window.openai = {
        widgetState: { privateContent },
        setWidgetState(payload) {
          privateContent = payload && payload.privateContent || null;
          localStorage.setItem(key, JSON.stringify(privateContent));
          return Promise.resolve();
        }
      };
    })();
  </script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<div id="integrated-clinical-workbench" class="icw-root">
  <style>
    #integrated-clinical-workbench {
      --icw-canvas: light-dark(#f7f9f8, #111614);
      --icw-sidebar: light-dark(#f2f5f3, #171d1b);
      --icw-surface: light-dark(#ffffff, #1d2421);
      --icw-subtle: light-dark(#f5f8f6, #242c29);
      --icw-muted: light-dark(#edf2ef, #2b3531);
      --icw-text: light-dark(#25362f, #edf3f0);
      --icw-text-2: light-dark(#5f6f68, #aab6b1);
      --icw-text-3: light-dark(#7d8b85, #89968f);
      --icw-line: light-dark(#dde5e1, #37433e);
      --icw-line-soft: light-dark(#e8edea, #2b3531);
      --icw-brand: light-dark(#176c58, #57c3a3);
      --icw-brand-dark: light-dark(#155e4d, #83d8be);
      --icw-brand-soft: light-dark(#e7f1ed, #173b31);
      --icw-blue: light-dark(#315f8f, #8bb7e2);
      --icw-blue-soft: light-dark(#edf3f9, #1c3042);
      --icw-warning: light-dark(#985d13, #e5b66f);
      --icw-warning-soft: light-dark(#fff8e8, #3b2d19);
      --icw-danger: light-dark(#a3483e, #ed928c);
      --icw-danger-soft: light-dark(#fff4f2, #3c211f);
      --icw-shadow: light-dark(0 8px 24px rgba(23, 53, 42, .07), 0 12px 30px rgba(0, 0, 0, .22));
      width: 100%; min-width: 0; overflow: hidden; position: relative;
      color: var(--icw-text); background: var(--icw-canvas); color-scheme: light dark;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; letter-spacing: 0;
    }
    #integrated-clinical-workbench * { box-sizing: border-box; }
    #integrated-clinical-workbench [hidden] { display: none !important; }
    #integrated-clinical-workbench button,
    #integrated-clinical-workbench input,
    #integrated-clinical-workbench textarea,
    #integrated-clinical-workbench select { font: inherit; letter-spacing: 0; color: inherit; }
    #integrated-clinical-workbench button { cursor: inherit; }
    #integrated-clinical-workbench .icw-shell { min-height: 820px; display: grid; grid-template-columns: 216px minmax(0, 1fr); }
    #integrated-clinical-workbench .icw-sidebar {
      position: relative; z-index: 5; min-width: 0; padding: 20px 13px; display: flex; flex-direction: column;
      background: var(--icw-sidebar); border-right: 1px solid var(--icw-line);
    }
    #integrated-clinical-workbench .icw-brand { height: 58px; padding: 0 9px; display: flex; align-items: center; gap: 11px; }
    #integrated-clinical-workbench .icw-brand-mark { width: 38px; height: 38px; flex: none; display: grid; place-items: center; border-radius: 10px; background: var(--icw-brand); color: #fff; }
    #integrated-clinical-workbench .icw-brand-mark svg { width: 21px; height: 21px; }
    #integrated-clinical-workbench .icw-brand strong { display: block; font-size: 19px; font-weight: 500; color: var(--icw-text); }
    #integrated-clinical-workbench .icw-brand small { display: block; margin-top: 2px; color: var(--icw-text-3); font-size: 11px; }
    #integrated-clinical-workbench .icw-nav { display: grid; gap: 4px; margin-top: 22px; }
    #integrated-clinical-workbench .icw-nav-button,
    #integrated-clinical-workbench .icw-subnav-button {
      width: 100%; min-height: 43px; padding: 0 12px; display: flex; align-items: center; gap: 11px;
      border: 0; border-radius: 9px; background: transparent; color: var(--icw-text-2); text-align: left; font-size: 13px;
    }
    #integrated-clinical-workbench .icw-nav-button:hover,
    #integrated-clinical-workbench .icw-subnav-button:hover { background: var(--icw-muted); color: var(--icw-brand-dark); }
    #integrated-clinical-workbench .icw-nav-button.is-active,
    #integrated-clinical-workbench .icw-subnav-button.is-active { background: var(--icw-brand-soft); color: var(--icw-brand-dark); font-weight: 500; }
    #integrated-clinical-workbench .icw-nav-button svg,
    #integrated-clinical-workbench .icw-subnav-button svg { width: 18px; height: 18px; flex: none; }
    #integrated-clinical-workbench .icw-nav-button .icw-chevron { width: 15px; height: 15px; margin-left: auto; }
    #integrated-clinical-workbench .icw-subnav { display: grid; gap: 2px; margin: 2px 0 6px 18px; padding-left: 10px; border-left: 1px solid var(--icw-line); }
    #integrated-clinical-workbench .icw-subnav-button { min-height: 34px; padding: 0 10px; border-radius: 7px; font-size: 12px; }
    #integrated-clinical-workbench .icw-subnav-button svg { width: 15px; height: 15px; }
    #integrated-clinical-workbench .icw-sidebar-foot { margin-top: auto; padding: 17px 8px 0; border-top: 1px solid var(--icw-line); }
    #integrated-clinical-workbench .icw-security { display: flex; gap: 9px; color: var(--icw-text-2); font-size: 11px; }
    #integrated-clinical-workbench .icw-security svg { width: 16px; height: 16px; flex: none; color: var(--icw-brand); }
    #integrated-clinical-workbench .icw-security b,
    #integrated-clinical-workbench .icw-security span { display: block; }
    #integrated-clinical-workbench .icw-security b { font-weight: 500; }
    #integrated-clinical-workbench .icw-security span { margin-top: 2px; color: var(--icw-text-3); }
    #integrated-clinical-workbench .icw-main { min-width: 0; }
    #integrated-clinical-workbench .icw-header { height: 70px; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; gap: 14px; background: light-dark(rgba(251, 252, 251, .92), rgba(20, 26, 23, .92)); border-bottom: 1px solid var(--icw-line); }
    #integrated-clinical-workbench .icw-header-left { min-width: 0; display: flex; align-items: center; gap: 8px; }
    #integrated-clinical-workbench .icw-header h1 { margin: 0; font-size: 16px; line-height: 1.3; font-weight: 500; }
    #integrated-clinical-workbench .icw-header p { margin: 4px 0 0; color: var(--icw-text-3); font-size: 11px; }
    #integrated-clinical-workbench .icw-header-actions { display: flex; align-items: center; gap: 8px; }
    #integrated-clinical-workbench .icw-demo-label { padding: 5px 8px; border-radius: 999px; color: var(--icw-brand-dark); background: var(--icw-brand-soft); font-size: 10px; white-space: nowrap; }
    #integrated-clinical-workbench .icw-icon-button,
    #integrated-clinical-workbench .icw-menu-button,
    #integrated-clinical-workbench .icw-close-button { width: 34px; height: 34px; padding: 0; display: grid; place-items: center; border: 1px solid var(--icw-line); border-radius: 8px; background: var(--icw-surface); }
    #integrated-clinical-workbench .icw-icon-button:hover,
    #integrated-clinical-workbench .icw-menu-button:hover,
    #integrated-clinical-workbench .icw-close-button:hover { background: var(--icw-subtle); }
    #integrated-clinical-workbench .icw-icon-button svg,
    #integrated-clinical-workbench .icw-menu-button svg,
    #integrated-clinical-workbench .icw-close-button svg { width: 16px; height: 16px; }
    #integrated-clinical-workbench .icw-menu-button,
    #integrated-clinical-workbench .icw-close-button { display: none; }
    #integrated-clinical-workbench .icw-content { max-width: 1500px; margin: auto; padding: 22px 28px 42px; }

    /* Mature Agent workspace */
    #integrated-clinical-workbench .icw-chat { max-width: 1180px; min-height: 690px; margin: 0 auto; display: flex; flex-direction: column; }
    #integrated-clinical-workbench .icw-chat-tools { min-height: 42px; display: flex; justify-content: flex-end; align-items: center; gap: 4px; }
    #integrated-clinical-workbench .icw-chat-tool { min-height: 32px; padding: 0 9px; display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 7px; background: transparent; color: var(--icw-text-2); font-size: 12px; }
    #integrated-clinical-workbench .icw-chat-tool:hover { color: var(--icw-brand-dark); background: var(--icw-brand-soft); }
    #integrated-clinical-workbench .icw-chat-tool svg { width: 14px; height: 14px; }
    #integrated-clinical-workbench .icw-thread { width: min(860px, 100%); margin: 0 auto; padding: 18px 0 12px; }
    #integrated-clinical-workbench .icw-user-message { max-width: 74%; margin: 10px 0 18px auto; padding: 10px 14px; border-radius: 14px 14px 4px 14px; color: #fff; background: var(--icw-brand); font-size: 12px; line-height: 1.6; }
    #integrated-clinical-workbench .icw-message-file { padding-bottom: 7px; margin-bottom: 5px; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid rgba(255,255,255,.22); font-size: 10px; }
    #integrated-clinical-workbench .icw-message-file svg { width: 14px; height: 14px; }
    #integrated-clinical-workbench .icw-assistant { margin: 14px 0; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 9px; }
    #integrated-clinical-workbench .icw-agent-avatar { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; color: var(--icw-brand); background: var(--icw-brand-soft); }
    #integrated-clinical-workbench .icw-agent-avatar svg { width: 14px; height: 14px; }
    #integrated-clinical-workbench .icw-agent-copy > p { margin: 3px 0 10px; color: var(--icw-text-2); font-size: 12px; line-height: 1.7; }
    #integrated-clinical-workbench .icw-import-card { overflow: hidden; border: 1px solid var(--icw-line); border-radius: 12px; background: var(--icw-surface); box-shadow: var(--icw-shadow); }
    #integrated-clinical-workbench .icw-import-flow { margin: 0; padding: 14px 16px 12px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); list-style: none; border-bottom: 1px solid var(--icw-line-soft); }
    #integrated-clinical-workbench .icw-import-flow li { position: relative; display: flex; align-items: center; gap: 7px; color: var(--icw-text-3); font-size: 10px; }
    #integrated-clinical-workbench .icw-import-flow li:not(:last-child)::after { content: ''; position: absolute; top: 12px; right: 8px; left: 36px; height: 1px; background: var(--icw-line); }
    #integrated-clinical-workbench .icw-step-mark { position: relative; z-index: 1; width: 24px; height: 24px; flex: none; display: grid; place-items: center; border: 1px solid var(--icw-line); border-radius: 50%; background: var(--icw-surface); }
    #integrated-clinical-workbench .icw-import-flow li.is-done,
    #integrated-clinical-workbench .icw-import-flow li.is-current { color: var(--icw-brand-dark); font-weight: 500; }
    #integrated-clinical-workbench .icw-import-flow li.is-done .icw-step-mark { background: var(--icw-brand-soft); border-color: transparent; }
    #integrated-clinical-workbench .icw-import-flow li.is-current .icw-step-mark { color: #fff; background: var(--icw-brand); border-color: var(--icw-brand); }
    #integrated-clinical-workbench .icw-import-head { padding: 13px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    #integrated-clinical-workbench .icw-file-title { display: flex; align-items: center; gap: 9px; min-width: 0; }
    #integrated-clinical-workbench .icw-file-title > svg { width: 18px; height: 18px; flex: none; color: var(--icw-brand); }
    #integrated-clinical-workbench .icw-file-title b,
    #integrated-clinical-workbench .icw-file-title small { display: block; }
    #integrated-clinical-workbench .icw-file-title b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; font-weight: 500; }
    #integrated-clinical-workbench .icw-file-title small { margin-top: 2px; color: var(--icw-text-3); font-size: 10px; }
    #integrated-clinical-workbench .icw-status { display: inline-flex; align-items: center; gap: 5px; color: var(--icw-warning); font-size: 10px; white-space: nowrap; }
    #integrated-clinical-workbench .icw-status i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    #integrated-clinical-workbench .icw-import-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--icw-line-soft); border-bottom: 1px solid var(--icw-line-soft); }
    #integrated-clinical-workbench .icw-import-metrics div { padding: 11px 14px; border-right: 1px solid var(--icw-line-soft); }
    #integrated-clinical-workbench .icw-import-metrics div:last-child { border-right: 0; }
    #integrated-clinical-workbench .icw-import-metrics b,
    #integrated-clinical-workbench .icw-import-metrics span { display: block; }
    #integrated-clinical-workbench .icw-import-metrics b { font-size: 14px; font-weight: 500; }
    #integrated-clinical-workbench .icw-import-metrics span { margin-top: 2px; color: var(--icw-text-3); font-size: 9px; }
    #integrated-clinical-workbench .icw-import-notice { margin: 12px 16px 0; padding: 10px 11px; display: flex; align-items: flex-start; gap: 8px; border: 1px solid light-dark(#ead7b9, #604725); border-radius: 8px; color: var(--icw-warning); background: var(--icw-warning-soft); font-size: 10px; line-height: 1.5; }
    #integrated-clinical-workbench .icw-import-notice svg { width: 15px; height: 15px; flex: none; margin-top: 1px; }
    #integrated-clinical-workbench .icw-import-notice b { display: block; font-weight: 500; }
    #integrated-clinical-workbench .icw-mapping-entry { margin: 10px 16px 15px; padding: 11px 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 1px solid var(--icw-line); border-radius: 8px; background: var(--icw-subtle); }
    #integrated-clinical-workbench .icw-mapping-entry b,
    #integrated-clinical-workbench .icw-mapping-entry span { display: block; }
    #integrated-clinical-workbench .icw-mapping-entry b { font-size: 11px; font-weight: 500; }
    #integrated-clinical-workbench .icw-mapping-entry span { margin-top: 3px; color: var(--icw-text-2); font-size: 10px; line-height: 1.4; }
    #integrated-clinical-workbench .icw-secondary-button,
    #integrated-clinical-workbench .icw-primary-button { min-height: 34px; padding: 7px 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--icw-line); border-radius: 8px; background: var(--icw-surface); font-size: 11px; white-space: nowrap; }
    #integrated-clinical-workbench .icw-secondary-button:hover { background: var(--icw-muted); }
    #integrated-clinical-workbench .icw-primary-button { color: #fff; border-color: var(--icw-brand); background: var(--icw-brand); }
    #integrated-clinical-workbench .icw-primary-button:hover { background: var(--icw-brand-dark); }
    #integrated-clinical-workbench .icw-secondary-button svg,
    #integrated-clinical-workbench .icw-primary-button svg { width: 14px; height: 14px; }
    #integrated-clinical-workbench .icw-composer { width: min(860px, calc(100% - 20px)); margin: auto auto 4px; padding: 10px 10px 8px 13px; display: grid; grid-template-columns: 1fr 36px 36px; align-items: end; border: 1px solid light-dark(#cfddd7, #42514a); border-radius: 18px; background: var(--icw-surface); box-shadow: 0 10px 30px rgba(23,53,42,.08); }
    #integrated-clinical-workbench .icw-composer textarea { grid-column: 1 / 4; min-height: 54px; padding: 4px 5px; resize: none; border: 0; outline: 0; background: transparent; font-size: 13px; line-height: 1.5; }
    #integrated-clinical-workbench .icw-attach-wrap { position: relative; grid-column: 2; }
    #integrated-clinical-workbench .icw-composer-action { width: 36px; height: 36px; padding: 0; display: grid; place-items: center; border: 0; border-radius: 10px; background: var(--icw-brand-soft); color: var(--icw-brand-dark); }
    #integrated-clinical-workbench .icw-composer-action svg { width: 16px; height: 16px; }
    #integrated-clinical-workbench .icw-send { grid-column: 3; color: #fff; background: var(--icw-brand); }
    #integrated-clinical-workbench .icw-attachment-menu { position: absolute; right: 0; bottom: 44px; z-index: 4; width: 214px; padding: 5px; border: 1px solid var(--icw-line); border-radius: 10px; background: var(--icw-surface); box-shadow: var(--icw-shadow); }
    #integrated-clinical-workbench .icw-attachment-menu button { width: 100%; min-height: 35px; padding: 7px 8px; display: flex; align-items: center; gap: 8px; border: 0; border-radius: 7px; background: transparent; text-align: left; font-size: 11px; }
    #integrated-clinical-workbench .icw-attachment-menu button:hover { background: var(--icw-subtle); }
    #integrated-clinical-workbench .icw-attachment-menu button:disabled { color: var(--icw-text-3); }
    #integrated-clinical-workbench .icw-attachment-menu svg { width: 14px; height: 14px; }
    #integrated-clinical-workbench .icw-attachment-menu small { margin-left: auto; color: var(--icw-warning); font-size: 9px; }

    /* Neuroimaging and EEG inside the same shell */
    #integrated-clinical-workbench .icw-module { max-width: 1180px; margin: 0 auto; }
    #integrated-clinical-workbench .icw-module-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; padding: 3px 0 20px; }
    #integrated-clinical-workbench .icw-module-head h2 { margin: 0; font-size: 23px; line-height: 1.3; font-weight: 500; }
    #integrated-clinical-workbench .icw-module-head p { max-width: 690px; margin: 7px 0 0; color: var(--icw-text-2); font-size: 12px; line-height: 1.55; }
    #integrated-clinical-workbench .icw-source-button { min-height: 36px; padding: 7px 10px; display: inline-flex; align-items: center; gap: 7px; flex: none; border: 1px solid var(--icw-line); border-radius: 8px; background: var(--icw-surface); font-size: 11px; }
    #integrated-clinical-workbench .icw-source-button svg { width: 15px; height: 15px; }
    #integrated-clinical-workbench .icw-demo-data { margin: -4px 0 15px; padding: 11px 0; display: grid; grid-template-columns: minmax(175px, 1.4fr) repeat(4, minmax(80px, .7fr)); border-top: 1px solid var(--icw-line); border-bottom: 1px solid var(--icw-line); }
    #integrated-clinical-workbench .icw-demo-data > div { min-width: 0; padding: 0 13px; border-right: 1px solid var(--icw-line-soft); }
    #integrated-clinical-workbench .icw-demo-data > div:last-child { border-right: 0; }
    #integrated-clinical-workbench .icw-demo-data b,
    #integrated-clinical-workbench .icw-demo-data span { display: block; }
    #integrated-clinical-workbench .icw-demo-data b { overflow: hidden; color: var(--icw-text); font-size: 13px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
    #integrated-clinical-workbench .icw-demo-data span { margin-top: 3px; color: var(--icw-text-3); font-size: 9px; }
    #integrated-clinical-workbench .icw-demo-data .icw-cohort b { color: var(--icw-brand-dark); font-size: 11px; }
    #integrated-clinical-workbench .icw-flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--icw-line); border-radius: 10px; overflow: hidden; background: var(--icw-surface); }
    #integrated-clinical-workbench .icw-flow-step { position: relative; min-width: 0; min-height: 112px; padding: 13px 14px; border: 0; border-right: 1px solid var(--icw-line); color: var(--icw-text); background: var(--icw-surface); text-align: left; transition: background .16s ease, color .16s ease; }
    #integrated-clinical-workbench .icw-flow-step:hover { color: var(--icw-brand-dark); background: var(--icw-brand-soft); }
    #integrated-clinical-workbench .icw-flow-step:focus-visible { z-index: 2; outline: 2px solid var(--icw-brand); outline-offset: -3px; }
    #integrated-clinical-workbench .icw-flow-step:last-child { border-right: 0; }
    #integrated-clinical-workbench .icw-flow-step:not(:last-child)::after { content: ''; position: absolute; z-index: 1; top: 28px; right: -5px; width: 8px; height: 8px; transform: rotate(45deg); border-top: 1px solid var(--icw-line); border-right: 1px solid var(--icw-line); background: var(--icw-surface); }
    #integrated-clinical-workbench .icw-flow-top { display: flex; align-items: center; gap: 8px; color: var(--icw-brand-dark); }
    #integrated-clinical-workbench .icw-flow-number { width: 22px; height: 22px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--icw-brand-soft); font-size: 10px; }
    #integrated-clinical-workbench .icw-flow-step b { font-size: 11px; font-weight: 500; }
    #integrated-clinical-workbench .icw-flow-step small { display: block; margin: 6px 0 0 30px; color: var(--icw-text-3); font-size: 9px; line-height: 1.4; }
    #integrated-clinical-workbench .icw-flow-queue { margin: 9px 0 0 30px; display: block; color: var(--icw-text-2); font-size: 9px; font-weight: 500; }
    #integrated-clinical-workbench .icw-flow-queue.is-waiting { color: var(--icw-warning); }
    #integrated-clinical-workbench .icw-flow-action { margin: 6px 0 0 30px; display: inline-flex; align-items: center; gap: 3px; color: var(--icw-brand-dark); font-size: 9px; font-weight: 500; }
    #integrated-clinical-workbench .icw-flow-action svg { width: 12px; height: 12px; }
    #integrated-clinical-workbench .icw-module-grid { margin-top: 22px; display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 18px; align-items: start; }
    #integrated-clinical-workbench .icw-module-grid > * { min-width: 0; }
    #integrated-clinical-workbench .icw-section-title { margin-bottom: 10px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
    #integrated-clinical-workbench .icw-section-title h3 { margin: 0; font-size: 15px; font-weight: 500; }
    #integrated-clinical-workbench .icw-section-title p { margin: 4px 0 0; color: var(--icw-text-3); font-size: 10px; }
    #integrated-clinical-workbench .icw-selected-count { color: var(--icw-text-3); font-size: 10px; white-space: nowrap; }
    #integrated-clinical-workbench .icw-results { overflow: hidden; border: 1px solid var(--icw-line); border-radius: 10px; background: var(--icw-surface); }
    #integrated-clinical-workbench .icw-result { border-bottom: 1px solid var(--icw-line-soft); }

      function renderSettingsModal(key, requestedTab) {

        state.settingsKey = key; state.settingsTab = tab;
        const lifecycle = {
          intake:'数据接入只建立合格、可追踪的标准数据，不执行预处理或结果计算。',
          preprocess:'预处理策略单独版本化；参数变化可能重新处理适用数据，已有结果保留。',
          postprocess:'后处理保存为可复用方案；只有被特征配置引用时才按需计算。',
          features:'结果提取读取合格的上游产物；参数变化不会无条件重跑预处理。',
          tensor:'张量拟合参数属于 DTI 特征配置，不会重跑 QSIPrep。',
          provenance:'结果登记保存数值、文件、质控、版本与完整来源，供复现和审计。'

      }

        if (!allowedSpaces.includes(state.atlasSpace)) state.atlasSpace = allowedSpaces[0];
        const text = state.atlasQuery.trim().toLowerCase();
        const rows = atlasCatalog.filter(atlas => (!state.atlasSpace || atlas.space === state.atlasSpace) && (!text || `${atlas.name} ${atlas.family}`.toLowerCase().includes(text)));
        root.querySelector('#icw-atlas-title').textContent = `为 ${result.title} 选择平台图谱`;
        root.querySelector('#icw-atlas-title').nextElementSibling.textContent = target === 't1:vbm' ? '仅显示平台登记为 MNI152NLin2009cAsym 的兼容图谱' : '目录名称、空间、标签数和审核状态来自当前平台图谱库';

          const eligibility = atlasEligibility(atlas, target);

        }).join('') : '<div class="icw-atlas-empty">没有匹配的图谱，请更换名称或模板空间。</div>';

        }).join('');
        return `<section class="icw-module" data-module="${key}">
          <div class="icw-module-head"><div><h2>${esc(config.title)}</h2><p>${esc(config.lead)}</p></div><button type="button" class="icw-source-button" data-toast="当前处理来源：${esc(config.source)}。"><i data-lucide="database" aria-hidden="true"></i>查看数据来源</button></div>
          <div class="icw-demo-data" aria-label="演示队列数据"><div class="icw-cohort"><b>${esc(config.demo.cohort)}</b><span>样板数据，不连接真实数据库</span></div><div><b>${esc(config.demo.subjects)}</b><span>演示患者</span></div><div><b>${esc(config.demo.visits)}</b><span>演示随访</span></div><div><b>${esc(config.demo.inputs)}</b><span>具备可用输入</span></div><div><b>${esc(config.demo.results)}</b><span>已登记结果</span></div></div>
          <div class="icw-flow" aria-label="可查看详情的分析流程">${flow}</div>
          <div class="icw-module-grid"><div><div class="icw-section-title"><div><h3>选择分析结果</h3><p>默认只显示医生关心的结果，处理依据按需展开。</p></div><span class="icw-selected-count">${config.waiting ? '后端接口待接入' : `已选择 ${chosen.length} 项`}</span></div><div class="icw-results">${resultRows}</div>
          </div><aside class="icw-plan"><div class="icw-plan-head"><h3>本次方案</h3><p>根据所选结果自动形成，提交前确认数据范围。</p></div><ul class="icw-plan-list"><li><span>数据类型</span><b>${esc(config.title)}</b></li><li><span>处理来源</span><b>${esc(selectionSource(key, chosen))}</b></li><li><span>所选结果</span><b>${chosen.length ? chosen.map(item => esc(item.short)).join('、') : (config.waiting ? '尚未开放选择' : '尚未选择')}</b></li><li><span>结果配置</span><b>${chosen.length ? chosen.map(item => `${esc(item.short)}：${esc(resultPlanSummary(key, item))}`).join('<br>') : '—'}</b></li><li><span>运行原则</span><b>${key === 't1' ? '按结果匹配处理来源' : '复用合格的上游结果'}</b></li></ul><div class="icw-plan-note ${config.waiting || blocked ? 'is-waiting' : ''}"><i data-lucide="${config.waiting || blocked ? 'circle-alert' : 'shield-check'}" aria-hidden="true"></i>${config.waiting ? '这是流程和术语样板，不代表 EEG 后端能力已经接入。' : blocked ? '至少有一个已选指标尚未选择可用的空间单位。' : '运行前检查先决条件；不满足时说明原因，不自动替换研究方案。'}</div><button type="button" class="icw-primary-button" ${config.waiting || !chosen.length || blocked ? 'disabled' : ''} data-toast="${config.waiting ? 'EEG 后端接口尚未接入。' : '正式版本将在此进入数据范围确认。'}"><i data-lucide="clipboard-check" aria-hidden="true"></i>${config.waiting ? 'EEG 接口待接入' : '确认方案与数据范围'}</button></aside></div>
        </section>`;
      }

      function retainedHtml(page) {
        const data = {
          dashboard:['数据总览','患者、随访、量表和专业数据的统一概览。','chart-no-axes-combined','展示样板不加载数据库统计','正式页面继续使用现有完整度、量表趋势与最近导入结构。'],
          patients:['患者随访','按患者查看人口学信息、随访记录、量表与专业检查。','users','展示样板不加载患者记录','正式页面继续使用现有患者列表、搜索与随访详情结构。'],
          catalog:['字段字典','维护人口学、临床、量表和专业结果字段。','book-open','展示样板不加载字段记录','正式页面继续使用现有字段分类、搜索与字段详情结构。'],
          history:['导入历史','查看表格与专业数据附件的处理记录。','history','展示样板不加载导入记录','正式页面继续使用现有导入列表与返回 Agent 对话的入口。']
        }[page];

      }

      function render() {
        activeNav();
        const titles = { workspace:['Agent 工作台','临床数据管理与分析'], dashboard:['数据总览','临床数据管理与分析'], patients:['患者随访','临床数据管理与分析'], catalog:['字段字典','临床数据管理与分析'], history:['导入历史','临床数据管理与分析'] };
        if (imaging[state.page]) { pageTitle.textContent = imaging[state.page].title; pageSubtitle.textContent = imaging[state.page].subtitle; content.innerHTML = imagingHtml(state.page); }
        else { pageTitle.textContent = titles[state.page][0]; pageSubtitle.textContent = titles[state.page][1]; content.innerHTML = state.page === 'workspace' ? workspaceHtml() : retainedHtml(state.page); }

      function mapTable(tab) {
        const head = root.querySelector('#icw-map-head'); const body = root.querySelector('#icw-map-body'); const progress = root.querySelector('#icw-map-progress');

      root.addEventListener('click', event => {
        const pageButton = event.target.closest('[data-page], [data-go]');
        if (pageButton) { state.page = pageButton.dataset.page || pageButton.dataset.go; render(); closeNav(); persist(); return; }
        const parent = event.target.closest('[data-parent]');
        if (parent) {
          const name = parent.dataset.parent; const open = parent.getAttribute('aria-expanded') !== 'true';
          root.querySelector(`[data-subnav="${name}"]`).hidden = !open; parent.setAttribute('aria-expanded', String(open)); parent.querySelector('.icw-chevron').setAttribute('data-lucide', open ? 'chevron-down' : 'chevron-right'); icons(); return;
        }
        const check = event.target.closest('[data-result-check]');
        if (check && !check.disabled) { const set = state.selected[state.page]; const id = check.dataset.resultCheck; set.has(id) ? set.delete(id) : set.add(id); render(); persist(); return; }
        const expand = event.target.closest('[data-result-expand]');
        if (expand) { const row = expand.closest('.icw-result'); const detail = row.querySelector('.icw-result-detail'); const open = row.classList.toggle('is-open'); detail.hidden = !open; expand.setAttribute('aria-expanded', String(open)); return; }
        const builtinUnit = event.target.closest('[data-builtin-unit]');
        if (builtinUnit && !builtinUnit.disabled) {
          const target = builtinUnit.dataset.builtinUnit; const value = builtinUnit.dataset.unitValue; const selectedUnits = state.builtins[target];
          selectedUnits.has(value) ? selectedUnits.delete(value) : selectedUnits.add(value);
          render(); persist(); return;
        }
        const openAtlas = event.target.closest('[data-open-atlas]');
        if (openAtlas) { state.atlasKey = openAtlas.dataset.openAtlas; state.atlasDraft = state.units[state.atlasKey].map(item => ({ ...item })); state.atlasQuery = ''; state.atlasSpace = state.atlasKey === 't1:vbm' ? 'MNI152NLin2009cAsym' : state.atlasKey.startsWith('fmri:') ? state.settings.fmri.outputSpace : ''; root.querySelector('#icw-atlas-search').value = ''; renderAtlasModal(); atlasModal.hidden = false; return; }
        if (event.target.closest('[data-close-atlas]')) { atlasModal.hidden = true; return; }
        const atlasSpace = event.target.closest('[data-atlas-space]');
        if (atlasSpace) { state.atlasSpace = atlasSpace.dataset.atlasSpace; renderAtlasModal(); return; }
        const atlasOption = event.target.closest('[data-atlas-index]');
        if (atlasOption) { const atlas = atlasCatalog[Number(atlasOption.dataset.atlasIndex)]; const found = state.atlasDraft.findIndex(item => item.name === atlas.name); if (found >= 0) state.atlasDraft.splice(found, 1); else state.atlasDraft.push({ ...atlas }); renderAtlasModal(); return; }
        if (event.target.closest('#icw-apply-atlas')) {
          if (state.atlasKey === 'fmri:fc' && !state.atlasDraft.length) { showToast('功能连接必须至少选择一个图谱。'); return; }
          state.units[state.atlasKey] = state.atlasDraft.map(item => ({ ...item }));
          const [key, resultId] = state.atlasKey.split(':'); const result = imaging[key].results.find(item => item.id === resultId);
          atlasModal.hidden = true; render(); persist(); showToast(`已为${result.short}应用 ${state.atlasDraft.length} 个图谱。`); return;
        }
        const openSettings = event.target.closest('[data-open-settings]');
        if (openSettings) { const key = openSettings.dataset.openSettings; state.settingsBackup = { ...state.settings[key] }; renderSettingsModal(key, openSettings.dataset.settingsStage || ''); settingsModal.hidden = false; return; }
        const closeSettings = event.target.closest('[data-close-settings]');
        if (closeSettings) { if (state.settingsKey && state.settingsBackup) state.settings[state.settingsKey] = { ...state.settingsBackup }; state.settingsBackup = null; settingsModal.hidden = true; return; }
        const settingChoice = event.target.closest('[data-setting-choice]');
        if (settingChoice && !settingChoice.disabled) {
          const name = settingChoice.dataset.settingChoice; state.settings[state.settingsKey][name] = settingChoice.dataset.value;
          if (state.settingsKey === 'fmri' && name === 'pipeline' && settingChoice.dataset.value === 'deepprep') state.settings.fmri.longitudinal = 'session';
          if (state.settingsKey === 'fmri' && name === 'preset') applyFmriPreset(settingChoice.dataset.value);
          renderSettingsModal(state.settingsKey, state.settingsTab); return;
        }
        const settingSwitch = event.target.closest('[data-setting-switch]');
        if (settingSwitch && !settingSwitch.disabled) {
          const name = settingSwitch.dataset.settingSwitch; state.settings[state.settingsKey][name] = !state.settings[state.settingsKey][name];
          if (state.settingsKey === 'fmri' && ['useMotion','useHighPass','useWmCsf','useGlobal','useCompcor','useScrub'].includes(name)) state.settings.fmri.preset = 'custom';
          renderSettingsModal(state.settingsKey, state.settingsTab); return;
        }
        if (event.target.closest('#icw-reset-settings')) { state.settings[state.settingsKey] = { ...defaultSettings[state.settingsKey] }; renderSettingsModal(state.settingsKey, state.settingsTab); showToast('已恢复当前模态的项目默认方案。'); return; }
        if (event.target.closest('#icw-apply-settings')) {
          if (state.settingsKey === 'fmri') ['fmri:alff','fmri:reho','fmri:fc'].forEach(target => {
            state.units[target] = state.units[target].filter(atlas => atlasEligibility(atlas, target).ok);
            const allowed = new Set(builtinOptions(target).filter(item => item[2]).map(item => item[0]));
            state.builtins[target] = new Set(Array.from(state.builtins[target]).filter(value => allowed.has(value)));
          });
          state.settingsBackup = null; settingsModal.hidden = true; render(); persist(); showToast('样板方案摘要已更新；未提交任务或写入后端。'); return;
        }
        if (event.target.closest('#icw-open-mapping')) { modal.hidden = false; state.mapTab = 'scales'; mapTable('scales'); icons(); return; }
        const close = event.target.closest('[data-close-modal]'); if (close) { modal.hidden = true; return; }
        const mapTab = event.target.closest('[data-map-tab]');
        if (mapTab) { state.mapTab = mapTab.dataset.mapTab; root.querySelectorAll('[data-map-tab]').forEach(button => { const active = button === mapTab; button.classList.toggle('is-active', active); button.setAttribute('aria-selected', String(active)); }); mapTable(state.mapTab); return; }
        if (event.target.closest('#icw-confirm-map')) { modal.hidden = true; showToast('样板仅展示审核结构，不会写入或修改数据。'); return; }
        const attach = event.target.closest('#icw-attach'); if (attach) { const menu = root.querySelector('#icw-attachment-menu'); menu.hidden = !menu.hidden; attach.setAttribute('aria-expanded', String(!menu.hidden)); return; }
        const toastButton = event.target.closest('[data-toast]'); if (toastButton && !toastButton.disabled) showToast(toastButton.dataset.toast);
      });
      root.querySelector('#icw-atlas-search').addEventListener('input', event => { state.atlasQuery = event.target.value; renderAtlasModal(); root.querySelector('#icw-atlas-search').focus(); });
      settingsModal.addEventListener('change', event => {
        const control = event.target.closest('[data-setting]'); if (!control || control.disabled) return;
        const name = control.dataset.setting; state.settings[state.settingsKey][name] = control.value;
        if (state.settingsKey === 'fmri' && name === 'preset') applyFmriPreset(control.value);
        renderSettingsModal(state.settingsKey, state.settingsTab);
      });
      root.querySelector('.icw-menu-button').addEventListener('click', () => { sidebar.classList.add('is-open'); scrim.classList.add('is-open'); });
      root.querySelector('.icw-close-button').addEventListener('click', closeNav); scrim.addEventListener('click', closeNav);
      window.addEventListener('openai:set_globals', event => { const next = event.detail && event.detail.globals && event.detail.globals.widgetState && event.detail.globals.widgetState.privateContent; if (!next) return; if (next.page) state.page = next.page; if (next.units) Object.keys(state.units).forEach(target => { if (Array.isArray(next.units[target])) state.units[target] = next.units[target].map(item => catalogItem(item && item.name)).filter(Boolean).map(item => ({ ...item })); }); if (next.builtins) Object.keys(state.builtins).forEach(target => { if (Array.isArray(next.builtins[target])) state.builtins[target] = new Set(next.builtins[target]); }); if (next.selected) Object.keys(imaging).forEach(key => { if (Array.isArray(next.selected[key])) state.selected[key] = new Set(next.selected[key]); }); if (next.settings) Object.keys(defaultSettings).forEach(key => state.settings[key] = { ...defaultSettings[key], ...(next.settings[key] || {}) }); render(); });
      render();
    })();
  </script>
</div>
